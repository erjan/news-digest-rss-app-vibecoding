[project]
name = "news-digest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "erjan", email = "erjcan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.12",
    "feedparser>=6.0.13",
    "google-genai>=2.16.0",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "openai>=2.49.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.164.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "schemathesis>=4.24.3",
    "testcontainers>=4.15.0",
]
