name: build-deploy-quay

on:
  push:
    branches:
      - experiment/quay
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push image
        run: |
          docker buildx build \
            --push \
            --tag quay.io/hivauz/news-digest-fast-api:${{ github.sha }} \
            --tag quay.io/hivauz/news-digest-fast-api:latest \
            .
