services:
  - type: web
    name: news-digest-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: news-digest-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: OTEL_ENABLED
        value: "false"

databases:
  - name: news-digest-db
    databaseName: news_digest
    user: app
